# PRISM-1's build settings (base/tools/build.py)
name = "PRISM-1"               # the build's files: prism-1.fwsc, prism-1-X.Y.rfm1, prism-1_host
id_prefix = "FM-1_95"          # package identity: dev FM-1_9500, releases FM-1_95XXYYZZ
usb_manufacturer = "prism1"
usb_product = "PRISM-1 FM-1"
o2 = ["dsp/*.c"]               # the sound (oscillators, filters, effects, the core) at -O2, the audio path from RAM
ram_layout = "packed"          # one SRAM budget: the RAM code is not held to 32 KiB
cpu2 = true                    # the second core renders the odd voices
cpu2_fallback = true           # a failing second core: one core until power-off, never a restart
stack_check = true             # the static worst case of the stacks, printed by every build
ir_pass = "tools/ir_same.py"   # (so the build writes the optimised IR stack_check reads)
main_stack = 6400
irq_stack = 4352
ram_code_allow = ["core_render"]   # it hands the odd voices to the second core: plat_cpu2_run / _wait
o2_cflags = ["-fno-builtin"]   # no memset / memcpy calls made up from loops (RAM code may not call the flash)
words = "words.tsv"
ble = false
repo = "https://github.com/ghjob360-Tmp/Tmp"
licence = "GPL-3.0-only"
authors = ["ghjob360"]
author = "ghjob360"
credits = "after Vital by Matt Tytel (GPL-3.0): its oscillator warps, envelope curves and voice architecture, cut down for the FM-1; built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hugelton Instruments)"
tagline = "a Vital-style wavetable synth: 8 voices, 3 wavetable oscillators + a sampler, 2 filters, 18 modulators, 32 mod slots, 9 effects"
description = "Eight voices on both cores of three wavetable oscillators (32 factory tables of 32 frames, unison up to 8 with Vital's stacks, its warps and spectral morphs) and a sample oscillator, through two filters (Vital's eight models, serial or parallel); six envelopes, eight LFOs with drawable shapes and Vital's sync modes, four random LFOs, four macros and a 32-slot modulation matrix with power curves; Vital's nine effects in any order. Assign modulation by picking up a source and turning any knob; the knobs show the modulation's reach and what a voice hears."
tags = ["synth"]
install = "https://github.com/ghjob360-Tmp/Tmp/tree/claude/mwave-fm1-custom-firmware-01qpvb/prism1"
site = "https://github.com/ghjob360-Tmp/Tmp/tree/claude/mwave-fm1-custom-firmware-01qpvb/prism1"
screenshot = "app/docs/screen.png"
