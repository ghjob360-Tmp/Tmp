# CHAIN-1's build settings (base/tools/build.py)
name = "CHAIN-1"               # the build's files: chain-1.fwsc, chain-1-X.Y.rfm1, chain-1_host
id_prefix = "FM-1_94"          # package identity: dev FM-1_9400, releases FM-1_94XXYYZZ
usb_manufacturer = "chain1"
usb_product = "CHAIN-1 FM-1"   # "FM-1" in it: the installers find the port by that
o2 = ["dsp.c", "logue/*.c"]    # the sound engine and the logue units' interpreter at -O2, from RAM (PLAT_RAM_CODE)
o2_cflags = ["-fno-builtin"]   # no memset / memcpy calls made up from its loops (they are in the flash)
ram_layout = "packed"          # one SRAM budget: the RAM code (the interpreter) is not held to 32 KiB
cpu2 = true                    # the second core runs the logue units
cpu2_fallback = true           # a failing second core: one core until power-off, never a restart
ram_code_allow = ["dsp_render", "job", "unit_fx"]   # the second core's work (plat_cpu2_run / _wait) and its timing (plat_ticks24)
words = "words.tsv"
ble = false
usb_host = true                # GLO + HOME: the USB port as a MIDI host (a USB-MIDI keyboard; a powered hub)
stack_bounds = ["uh_probe=3", "uh_hub_port_probe=3"]   # felucca-bsp's USB host: a hub, then its devices
# the .rfm1's manifest and firmware.json
repo = "https://github.com/ghjob360-Tmp/Tmp"
licence = "MPL-2.0"
authors = ["ghjob360"]
author = "ghjob360"
tagline = "a one-voice synth in a fixed chain: OSC, FILTER, EG, MOD, DELAY, REVERB, ARP"
description = "One voice through a fixed chain - four oscillators (saw, triangle, square, 2-op phase modulation) with their own LFO, a 2/4-pole state-variable filter with a sweep, five envelope types with tremolo, chorus/ensemble/phaser/flanger, five delays, five reverbs and a ten-pattern arpeggiator. Its layout follows a well-known pocket synth's signal flow; the DSP is original."
tags = ["synth"]
install = "https://github.com/ghjob360-Tmp/Tmp/tree/claude/mwave-fm1-custom-firmware-01qpvb/chain1"
site = "https://github.com/ghjob360-Tmp/Tmp/tree/claude/mwave-fm1-custom-firmware-01qpvb/chain1"
screenshot = "app/docs/screen.png"
