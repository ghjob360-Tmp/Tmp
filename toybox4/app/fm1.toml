# TOYBOX-4's build settings (base/tools/build.py)
name = "TOYBOX-4"
id_prefix = "FM-1_96"          # package identity: dev FM-1_9600, releases FM-1_96XXYYZZ
usb_manufacturer = "toybox4"
usb_product = "TOYBOX-4 FM-1"
o2 = ["dsp/*.c"]               # the sound (engines, effects, the core) at -O2, from RAM (PLAT_RAM_CODE)
ram_layout = "packed"          # one SRAM budget: the RAM code is not held to 32 KiB
cpu2 = true                    # the second core renders the odd voices
cpu2_fallback = true           # a failing second core: one core until power-off, never a restart
stack_check = true             # the static worst case of the stacks, printed by every build
ir_pass = "tools/ir_same.py"   # (so the build writes the optimised IR stack_check reads)
main_stack = 8192
irq_stack = 4096
ram_code_allow = ["core_render"]   # it hands the odd voices to the second core: plat_cpu2_run / _wait are platform calls
o2_cflags = ["-fno-builtin"]
words = "words.tsv"
ble = false
usb_host = true                # GLO + HOME (outside the mixer): the USB port as a MIDI host (a USB-MIDI keyboard)
stack_bounds = ["uh_probe=3", "uh_hub_port_probe=3"]   # felucca-bsp's USB host: a hub, then its devices
repo = "https://github.com/ghjob360-Tmp/Tmp"
licence = "MPL-2.0"
authors = ["ghjob360"]
author = "ghjob360"
credits = "built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hugelton Instruments)"
tagline = "an OP-1-style four-track pocket studio: 11 engines, 9 effects, 7 sequencers, a tape with tricks, a sampler"
description = "Four tracks, each with a synth and a drum instrument. Eleven synth engines, a 24-key drum kit or a 24-slice sampled kit, nine effects, five LFOs that reach any parameter, seven sequencers (loop, grid, spin, hands, draw, arp, latch), a 128-bar four-track event tape with varispeed, reverse and sixteen tape tricks, a mixer with EQ, master effect and output stage, and a sampler that records the output into flash. Every module is an animated picture drawn in the four knobs' colours."
tags = ["synth", "groovebox"]
install = "https://github.com/ghjob360-Tmp/Tmp/tree/claude/mwave-fm1-custom-firmware-01qpvb/toybox4"
site = "https://github.com/ghjob360-Tmp/Tmp/tree/claude/mwave-fm1-custom-firmware-01qpvb/toybox4"
screenshot = "app/docs/screen.png"
